<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Doubloon System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] flex items-center justify-center h-screen">
    <div class="bg-[#1A1A1A] p-10 rounded-lg border-2 border-[#00A19B] text-center shadow-2xl">
        <h1 class="text-[#00A19B] text-3xl font-serif mb-6 uppercase">Identifique-se, Marujo</h1>
        <form action="/login" method="POST">
            <input type="password" name="senha" placeholder="Chave de Acesso" 
                   class="w-full bg-[#121212] border border-gray-700 p-3 rounded mb-4 text-white text-center outline-none focus:border-[#00A19B]" required>
            <button type="submit" class="w-full bg-[#00A19B] text-black font-bold py-3 rounded hover:bg-[#007a75] transition">
                Entrar no Sistema
            </button>
        </form>
    </div>
</body>
</html>
