<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Doubloon System - Arsenal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
</head>
<body class="bg-[#121212] text-white p-10">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-serif text-[#00A19B] uppercase">Arsenal</h1>
            <a href="/logout" class="text-red-500 hover:underline">Sair do Galeão</a>
        </div>

        {% if role == 'admin' %}
        <div class="mb-10 p-6 bg-[#1A1A1A] border border-[#00A19B] rounded-lg">
            <h2 class="text-[#00A19B] text-xl mb-4">⚓ Adicionar Novo Item (Acesso Master)</h2>
            <form action="/adicionar" method="POST" class="grid grid-cols-4 gap-4">
                <input type="text" name="nome" placeholder="Nome" class="bg-[#121212] border p-2 rounded" required>
                <input type="text" name="categoria" placeholder="Categoria" class="bg-[#121212] border p-2 rounded">
                <input type="number" name="quantidade" placeholder="Qtd" class="bg-[#121212] border p-2 rounded" required>
                <button type="submit" class="bg-[#00A19B] text-black font-bold rounded">Cadastrar</button>
            </form>
        </div>
        {% endif %}

        <div class="bg-[#1A1A1A] border border-gray-800 rounded-lg overflow-hidden">
            <table class="w-full">
                <thead class="bg-[#222] text-[#00A19B]">
                    <tr>
                        <th class="p-4 text-left">Item</th>
                        <th class="p-4">Categoria</th>
                        <th class="p-4 text-center">Estoque</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in itens %}
                    <tr class="border-b border-gray-800">
                        <td class="p-4">{{ item.nome }}</td>
                        <td class="p-4 text-center text-gray-500">{{ item.categoria }}</td>
                        <td class="p-4 text-center font-mono">{{ item.quantidade }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
