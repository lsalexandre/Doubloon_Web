<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar | Doubloon System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #0b0e11; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white">
    <div class="bg-[#161b22] p-10 rounded border border-[#00A19B]/50 w-full max-w-lg shadow-2xl">
        <h2 class="text-[#00A19B] text-lg font-bold mb-6 uppercase tracking-widest border-b border-gray-800 pb-4">Edição Manual de Ativo</h2>
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-[10px] text-gray-500 uppercase mb-2 font-bold">Nome do Item</label>
                <input type="text" name="nome" value="{{ item.nome }}" class="w-full bg-[#0b0e11] border border-gray-700 p-3 rounded text-sm text-white focus:border-[#00A19B] outline-none" required>
            </div>
            <div>
                <label class="block text-[10px] text-gray-500 uppercase mb-2 font-bold">Categoria</label>
                <input type="text" name="categoria" value="{{ item.categoria }}" class="w-full bg-[#0b0e11] border border-gray-700 p-3 rounded text-sm text-white focus:border-[#00A19B] outline-none">
            </div>
            <div>
                <label class="block text-[10px] text-gray-500 uppercase mb-2 font-bold">Correção de Saldo</label>
                <input type="number" name="quantidade" value="{{ item.quantidade }}" class="w-full bg-[#0b0e11] border border-gray-700 p-3 rounded text-sm text-white focus:border-[#00A19B] outline-none" required>
            </div>
            <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 bg-[#00A19B] text-black font-bold py-3 rounded uppercase text-xs tracking-widest hover:bg-[#008a84] transition">Salvar Alterações</button>
                <a href="/inventario" class="flex-1 border border-gray-700 text-center py-3 rounded uppercase text-xs font-bold tracking-widest hover:bg-gray-800 transition">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
