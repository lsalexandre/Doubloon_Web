<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Edit Resource | Doubloon System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#0b0e11] text-[#e1e1e1] flex items-center justify-center min-h-screen p-4">
    <div class="bg-[#161b22] p-10 rounded border border-[#00A19B] w-full max-w-lg shadow-2xl">
        <h2 class="text-white text-xl font-semibold mb-8 uppercase tracking-widest border-b border-gray-800 pb-4">Edição de Registro</h2>
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-[10px] text-gray-500 uppercase mb-2">Nome do Recurso</label>
                <input type="text" name="nome" value="{{ item.nome }}" class="w-full bg-[#0d1117] border border-gray-700 p-3 rounded text-sm focus:border-[#00A19B] outline-none" required>
            </div>
            <div>
                <label class="block text-[10px] text-gray-500 uppercase mb-2">Classificação Técnica</label>
                <input type="text" name="categoria" value="{{ item.categoria }}" class="w-full bg-[#0d1117] border border-gray-700 p-3 rounded text-sm focus:border-[#00A19B] outline-none">
            </div>
            <div>
                <label class="block text-[10px] text-gray-500 uppercase mb-2">Volume Atualizado</label>
                <input type="number" name="quantidade" value="{{ item.quantidade }}" class="w-full bg-[#0d1117] border border-gray-700 p-3 rounded text-sm focus:border-[#00A19B] outline-none" required>
            </div>
            <div class="flex gap-6 pt-6">
                <button type="submit" class="flex-1 bg-[#00A19B] text-white text-xs font-bold py-3 rounded uppercase hover:bg-[#008a84] transition">Salvar Alterações</button>
                <a href="/" class="flex-1 border border-gray-700 text-center py-3 text-xs uppercase font-bold hover:bg-gray-800 transition">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
